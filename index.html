<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>SiteScoper — AI Website Analyzer</title>
    <meta name="description" content="Crawl any website and get AI-powered suggestions for UX, SEO, accessibility and design improvements.">
    <meta name="author" content="Lovable" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/favicon.ico">

    <!-- Perf: warm up critical origins to reduce FCP/connection latency -->
    <link rel="preconnect" href="https://tmdnoailedngafchtaxj.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://tmdnoailedngafchtaxj.supabase.co">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Security: clickjacking protection + baseline CSP frame-ancestors.
         Note: full CSP/X-Frame-Options should be set as HTTP headers at the
         hosting layer; these meta tags provide a baseline defense in depth. -->
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/attachments/og-images/e6aaf4ed-72ae-4d3f-bb2f-341eb5731759">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/attachments/og-images/e6aaf4ed-72ae-4d3f-bb2f-341eb5731759">
    <meta property="og:title" content="SiteScoper — AI Website Analyzer">
  <meta name="twitter:title" content="SiteScoper — AI Website Analyzer">
  <meta property="og:description" content="Crawl any website and get AI-powered suggestions for UX, SEO, accessibility and design improvements.">
  <meta name="twitter:description" content="Crawl any website and get AI-powered suggestions for UX, SEO, accessibility and design improvements.">
</head>

  <body>
    <div id="root">
      <!-- Critical above-the-fold fallback so FCP fires before JS hydrates -->
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b0f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;text-align:center">
        <div>
          <h1 style="font-size:2rem;margin:0 0 12px;font-weight:700">SiteScoper — AI Website Analyzer</h1>
          <p style="margin:0;opacity:.7;font-size:1rem">Loading your honest website audit…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
